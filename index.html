<!DOCTYPE html>
<html>
<head>
    <title>SyncDoc - Collaborative Editor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef3f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #154360;
        }

        .subtitle {
            text-align: center;
            color: #555;
        }

        .editors {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }

        .panel {
            background: white;
            padding: 18px;
            border-radius: 10px;
            flex: 1;
            box-shadow: 0 2px 8px #ccc;
        }

        textarea, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            background: #2874a6;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #154360;
        }

        .document {
            background: white;
            padding: 20px;
            margin-top: 25px;
            border-radius: 10px;
            min-height: 180px;
        }

        .block {
            border-left: 5px solid #2874a6;
            background: #f5f8fa;
            padding: 12px;
            margin: 12px 0;
            border-radius: 5px;
            overflow-wrap: anywhere;
        }

        .user-a {
            border-left-color: #2874a6;
        }

        .user-b {
            border-left-color: #239b56;
        }

        .author {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            background: #e8edf2;
            padding: 10px;
        }

        .status {
            text-align: center;
            color: #239b56;
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            .editors {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>SyncDoc</h1>

    <p class="subtitle">
        Collaborative Document Engine with AST Conflict Resolution
    </p>

    <p class="status" id="status">
        Document Ready - Both Users Connected
    </p>

    <div class="editors">

        <!-- User A -->
        <div class="panel">
            <h2>User A</h2>
            <p>Add a paragraph</p>

            <textarea id="textA"
                placeholder="Enter your paragraph..."></textarea>

            <button onclick="addBlock('A', 'paragraph')">
                Add Paragraph
            </button>
        </div>

        <!-- User B -->
        <div class="panel">
            <h2>User B</h2>
            <p>Add a code block</p>

            <textarea id="textB"
                placeholder="Enter your code..."></textarea>

            <button onclick="addBlock('B', 'code')">
                Add Code Block
            </button>
        </div>

    </div>

    <!-- Shared document -->
    <div class="document">
        <h2>Shared Document</h2>

        <div id="documentContent">
            <p>Your document changes will appear here.</p>
        </div>
    </div>

    <div style="text-align:center; margin-top:20px;">
        <button onclick="clearDocument()">
            Clear Document
        </button>
    </div>

</div>

<script>

    // Shared document stores independent blocks
    let documentBlocks = [];

    // Add a new block
    function addBlock(user, type) {

        let input;

        if (user === "A") {
            input = document.getElementById("textA");
        } else {
            input = document.getElementById("textB");
        }

        let content = input.value.trim();

        if (content === "") {
            alert("Please enter some content!");
            return;
        }

        // Create a unique block ID
        let block = {
            id: Date.now() + Math.random(),
            author: user,
            type: type,
            content: content
        };

        // Add without overwriting existing blocks
        documentBlocks.push(block);

        // Update the shared document
        displayDocument();

        // Clear input
        input.value = "";

        document.getElementById("status").textContent =
            "New block added by User " + user;
    }

    // Display all document blocks
    function displayDocument() {

        let area = document.getElementById("documentContent");

        area.innerHTML = "";

        documentBlocks.forEach(function(block) {

            let box = document.createElement("div");

            box.className = "block user-" +
                block.author.toLowerCase();

            let author = document.createElement("div");
            author.className = "author";
            author.textContent =
                "User " + block.author + " | " + block.type +
                " | Block ID: " + String(block.id).slice(0, 8);

            box.appendChild(author);

            if (block.type === "code") {

                let code = document.createElement("pre");
                code.textContent = block.content;
                box.appendChild(code);

            } else {

                let paragraph = document.createElement("p");
                paragraph.textContent = block.content;
                box.appendChild(paragraph);

            }

            area.appendChild(box);

        });
    }

    // Clear all blocks
    function clearDocument() {

        if (confirm("Do you want to clear the document?")) {

            documentBlocks = [];

            displayDocument();

            document.getElementById("status").textContent =
                "Document Cleared";
        }
    }

</script>

</body>
</html>
